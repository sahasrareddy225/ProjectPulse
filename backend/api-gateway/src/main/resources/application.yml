server:
  port: 8081

spring:
  application:
    name: api-gateway
  config:
    import: "optional:configserver:http://localhost:8888"
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/auth/**
            - id: domain-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/projects/**,/api/tasks/**,/api/analytics/**,/api/ai/**
            - id: notification-service
              uri: http://localhost:8085
              predicates:
                - Path=/api/notifications/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
