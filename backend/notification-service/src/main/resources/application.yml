server:
  port: 8085

spring:
  application:
    name: notification-service
  config:
    import: "optional:configserver:http://localhost:8888"
  mongodb:
    uri: ${NOTIFICATION_DB_URI:${DOMAIN_DB_URI:${AUTH_DB_URI}}}
    database: notification_db
  data:
    mongodb:
      uri: ${NOTIFICATION_DB_URI:${DOMAIN_DB_URI:${AUTH_DB_URI}}}
      database: notification_db
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: notification-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.projectpulse.*"
        spring.json.value.default.type: com.projectpulse.notificationservice.event.ProjectCreatedEvent
        spring.json.use.type.headers: false

kafka:
  consumer:
    auto-startup: ${KAFKA_AUTO_STARTUP:true}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
