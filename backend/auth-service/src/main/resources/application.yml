server:
  port: 8082

spring:
  application:
    name: auth-service
  config:
    import: "optional:configserver:http://localhost:8888"
  mongodb:
    uri: ${AUTH_DB_URI}
    database: auth_db
  data:
    mongodb:
      uri: ${AUTH_DB_URI}
      database: auth_db

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
